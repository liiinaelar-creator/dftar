<title>دفتر الكريدي - إدارة الديون والمتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --glass-border: rgba(255, 255, 255, 0.65);
  --cyan: #00eaff;
  --purple: #a34cff;
  --ink: #ffffff;
  --ink-dim: rgba(240, 248, 255, 0.88);
  --green-txt: #4ade80;
  --red-txt: #ff5c77;
  --warn-txt: #fde047;
  --blur: blur(28px) saturate(150%);
}

:root[data-theme="dark"] {
  --glass-border: rgba(165, 243, 252, 0.42);
  --ink-dim: rgba(224, 242, 254, 0.82);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Cairo", system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, #00dfff 0%, transparent 35%),
    radial-gradient(circle at 90% 10%, #a52bff 0%, transparent 35%),
    radial-gradient(circle at 10% 90%, #8c22ff 0%, transparent 35%),
    radial-gradient(circle at 90% 90%, #00d9ff 0%, transparent 35%),
    linear-gradient(135deg, #003b91, #075bdc, #001d69);
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

:root[data-theme="dark"] body {
  background:
    radial-gradient(circle at 10% 10%, rgba(0, 223, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 90% 10%, rgba(165, 43, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 10% 90%, rgba(140, 34, 255, 0.42) 0%, transparent 36%),
    radial-gradient(circle at 90% 90%, rgba(0, 217, 255, 0.42) 0%, transparent 36%),
    linear-gradient(135deg, #011438, #04245e, #010b26);
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(110px);
  pointer-events: none;
  z-index: 0;
}

body::before { background: #00eaff; top: -130px; left: -120px; opacity: 0.85; }
body::after { background: #a000ff; bottom: -150px; right: -100px; opacity: 0.85; }

.bubble {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.78), rgba(100,220,255,0.25) 40%, rgba(0,60,180,0.2));
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.4), 0 0 20px rgba(0, 230, 255, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 0;
}
.bubble-1 { width: 85px; height: 85px; top: 14%; left: 4%; }
.bubble-2 { width: 105px; height: 105px; top: 18%; right: 3%; }
.bubble-3 { width: 50px; height: 50px; top: 64%; left: 2%; }
.bubble-4 { width: 110px; height: 110px; bottom: 8%; right: 5%; }

#app {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 116px;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   واجهة تسجيل الدخول وإنشاء الحساب (Liquid Glass Login UI)
   ========================================================================== */
.lq-auth-wrap {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 0;
  min-height: calc(100vh - 30px);
}

.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 30px 22px 26px;
  border-radius: 38px;
  background: linear-gradient(135deg, rgba(255,255,255,0.19), rgba(20,100,220,0.12), rgba(160,80,255,0.17));
  border: 1.5px solid var(--glass-border);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow: inset 0 0 25px rgba(255,255,255,0.17), 0 0 30px rgba(0,220,255,0.22), 0 20px 60px rgba(0,0,40,0.3);
  overflow: hidden;
}

.login-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(125deg, rgba(255,255,255,0.22), transparent 35%, transparent 70%, rgba(0,255,255,0.12));
  pointer-events: none;
}

.lq-avatar {
  position: relative;
  z-index: 1;
  width: 86px;
  height: 86px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0,210,255,0.55), rgba(100,50,255,0.6));
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 20px rgba(0,230,255,0.6), inset 0 0 20px rgba(255,255,255,0.25);
}
.lq-avatar svg { width: 46px; height: 46px; fill: white; }

.lq-title { position: relative; color: white; font-size: 28px; font-weight: 900; text-align: center; margin: 0 0 4px; text-shadow: 0 2px 10px rgba(0,0,40,0.25); }
.lq-subtitle { position: relative; color: rgba(255,255,255,0.88); text-align: center; font-size: 13.5px; font-weight: 600; margin: 0 0 22px; }

.input-box {
  position: relative;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  margin-bottom: 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.14);
  box-shadow: inset 0 0 12px rgba(255,255,255,0.1), 0 0 12px rgba(0,200,255,0.13);
  transition: .25s;
}
.input-box:focus-within { border-color: #72faff; box-shadow: 0 0 18px rgba(0,235,255,0.4); }
.input-box svg { width: 23px; height: 23px; stroke: white; fill: none; stroke-width: 2; flex-shrink: 0; }
.input-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  padding: 0 12px;
}
.input-box input::placeholder { color: rgba(255,255,255,0.82); }

.eye { cursor: pointer; opacity: .9; transition: .2s; }
.eye:hover { opacity: 1; filter: drop-shadow(0 0 5px white); }

.options { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 4px 18px; color: white; font-size: 13px; font-weight: 700; }
.remember { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.remember input { accent-color: #00eaff; width: 16px; height: 16px; cursor: pointer; }
.forgot-link { background: transparent; border: 0; color: white; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
.forgot-link:hover { text-decoration: underline; }

.login-btn {
  position: relative;
  width: 100%;
  height: 56px;
  border: 1px solid white;
  border-radius: 20px;
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  font: inherit;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,230,255,0.5), inset 0 2px 8px white;
  transition: .25s;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.7; cursor: wait; }

.divider { display: flex; align-items: center; gap: 14px; color: white; font-size: 13px; font-weight: 700; margin: 16px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.5); }

.google-btn {
  width: 100%;
  height: 54px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.85);
  background: linear-gradient(120deg, rgba(255,255,255,0.92), rgba(210,235,255,0.78));
  color: #092c70;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(0,220,255,0.3), inset 0 2px 8px white;
  transition: .25s;
}
.google-btn:active { transform: scale(0.98); }

.create-account-btn {
  width: 100%;
  height: 54px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: inset 0 0 12px rgba(255,255,255,0.15), 0 0 15px rgba(0,220,255,0.25);
  transition: .25s;
}
.create-account-btn svg { width: 23px; height: 23px; fill: none; stroke: white; stroke-width: 1.8; flex-shrink: 0; }

.guest-link {
  display: block;
  margin: 16px auto 0;
  background: transparent;
  border: 0;
  color: rgba(255, 255, 255, 0.92);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
}

/* ==========================================================================
   الهيدر وعناصر الواجهة الرئيسية
   ========================================================================== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
  gap: 8px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 19px;
  font-weight: 900;
  text-shadow: 0 2px 10px rgba(0, 0, 40, 0.35);
  cursor: pointer;
  padding: 5px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(160, 80, 255, 0.14));
  border: 1px solid rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 16px rgba(0, 220, 255, 0.22);
  transition: transform 0.15s ease;
  max-width: 65%;
}
.brand-wrap span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-wrap:active { transform: scale(0.97); }
.edit-hint { opacity: 0.8; display: inline-flex; align-items: center; flex: none; }

.glass-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(20, 100, 220, 0.14), rgba(160, 80, 255, 0.2));
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2), 0 0 16px rgba(0, 230, 255, 0.28);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease;
  flex: none;
  overflow: hidden;
  padding: 0;
  font-weight: 900;
  font-size: 18px;
}
.glass-circle:active { transform: scale(0.92); }
.glass-circle img { width: 100%; height: 100%; object-fit: cover; }

.sync-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #00eaff;
  border: 1.5px solid #00245f;
  box-shadow: 0 0 8px #00eaff;
}
.sync-dot.syncing { background: #a34cff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* شريط التبويبات: العملاء / الموردون */
.seg-wrap {
  display: flex;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(20, 100, 220, 0.12), rgba(160, 80, 255, 0.16));
  border: 1.5px solid var(--glass-border);
  border-radius: 24px;
  padding: 4px;
  margin-bottom: 12px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.15), 0 0 22px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

.seg-btn {
  flex: 1;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(255, 255, 255, 0.9);
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.22s ease;
}

.seg-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  border: 1px solid #ffffff;
  box-shadow: 0 0 18px rgba(0, 230, 255, 0.48), inset 0 2px 6px #ffffff;
}
.seg-btn.active svg circle,
.seg-btn.active svg rect,
.seg-btn.active svg path {
  stroke: #00245f;
}

/* البطاقات المالية: لي وعليّ */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-card {
  position: relative;
  border-radius: 24px;
  padding: 10px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  overflow: hidden;
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.16), 0 0 22px rgba(0, 220, 255, 0.2);
}

.stat-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.24), transparent 45%);
  pointer-events: none;
}

.stat-card.green { background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 234, 255, 0.22), rgba(16, 185, 129, 0.22)); }
.stat-card.red { background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(163, 76, 255, 0.24), rgba(244, 63, 94, 0.2)); }

.stat-info { text-align: center; flex: 1; }
.stat-label { font-size: 12px; font-weight: 800; color: #ffffff; line-height: 1.2; }
.stat-val { font-size: 16.5px; font-weight: 900; letter-spacing: -0.3px; direction: ltr; display: inline-block; line-height: 1.35; }
.stat-card.green .stat-val { color: #6ee7b7; text-shadow: 0 0 12px rgba(0, 234, 255, 0.45); }
.stat-card.red .stat-val { color: #fda4af; text-shadow: 0 0 12px rgba(163, 76, 255, 0.45); }

.icon-3d-box {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid rgba(255, 255, 255, 0.7);
}
.icon-3d-box.green { background: linear-gradient(135deg, #00eaff, #10b981); box-shadow: 0 0 14px rgba(0, 234, 255, 0.45), inset 0 1px 3px #ffffff; }
.icon-3d-box.red { background: linear-gradient(135deg, #a34cff, #f43f5e); box-shadow: 0 0 14px rgba(163, 76, 255, 0.45), inset 0 1px 3px #ffffff; }

/* شريط البحث والفلتر + الفلاتر السريعة */
.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.search-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-box input {
  width: 100%;
  height: 44px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12), 0 0 14px rgba(0, 200, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  padding: 0 40px 0 14px;
  outline: none;
  transition: .25s;
}
.search-box input:focus { border-color: #72faff; box-shadow: 0 0 18px rgba(0, 235, 255, 0.42); }
.search-box input::placeholder { color: rgba(255, 255, 255, 0.82); }
.search-icon { position: absolute; right: 14px; pointer-events: none; opacity: 0.95; display: grid; }

.filter-btn {
  width: 44px;
  height: 44px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(160, 80, 255, 0.18));
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 14px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.filter-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  border-color: #ffffff;
  box-shadow: 0 0 20px rgba(0, 230, 255, 0.55);
}
.filter-btn.active svg { stroke: #00245f; }

/* شرائح الفلترة السريعة (الكل / المتأخرون / لي / عليّ) */
.chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip-btn {
  flex: none;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.13);
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  font-weight: 800;
  padding: 5px 12px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: .2s;
}
.chip-btn.active {
  background: linear-gradient(110deg, #00eaff, #b58aff);
  color: #00245f;
  border-color: #fff;
  box-shadow: 0 0 14px rgba(0, 230, 255, 0.45);
}

.badge-due {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 999px;
  margin-right: 5px;
  vertical-align: middle;
}
.badge-due.overdue {
  background: rgba(244, 63, 94, 0.35);
  border: 1px solid rgba(253, 164, 175, 0.75);
  color: #ffe4e6;
}
.badge-due.upcoming {
  background: rgba(250, 204, 21, 0.25);
  border: 1px solid rgba(253, 224, 71, 0.65);
  color: #fef08a;
}

/* بطاقات القائمة الزجاجية السائلة */
.glass-card {
  position: relative;
  background: linear-gradient(135deg, rgba(255,255,255,0.19), rgba(20,100,220,0.12), rgba(160,80,255,0.16));
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  border-radius: 24px;
  padding: 11px 13px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.14), 0 0 20px rgba(0, 220, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  cursor: pointer;
  transition: transform 0.15s ease;
  overflow: hidden;
}
.glass-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.2), transparent 40%);
  pointer-events: none;
}
.glass-card:active { transform: scale(0.985); }

.avatar-3d {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 210, 255, 0.6), rgba(100, 50, 255, 0.65));
  border: 1.5px solid rgba(255, 255, 255, 0.75);
  box-shadow: 0 0 14px rgba(0, 230, 255, 0.45), inset 0 0 10px rgba(255, 255, 255, 0.3);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 16px;
  color: #fff;
  flex: none;
}

.card-main { flex: 1; min-width: 0; }
.card-title { font-weight: 800; font-size: 14.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
/* ==========================================================================
   إعدادات مشروع Firebase المدمجة (credit-2b87e)
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAVbA4WIgmc5LzuXWXRNC-2IbPCTQG5nMQ",
  authDomain: "credit-2b87e.firebaseapp.com",
  projectId: "credit-2b87e",
  storageBucket: "credit-2b87e.firebasestorage.app",
  messagingSenderId: "222917215707",
  appId: "1:222917215707:web:95284d3b638dedd44013fe",
  measurementId: "G-4M6Y1E79EX"
};

const GUEST_MODE_KEY = "kridi-guest-mode";
const LOCAL_BASE_KEY = "kridi-v2";
const D = 864e5;

let fbApp = null, auth = null, db = null, unsubDoc = null;
let currentUser = null;
let authReady = false;
let authBusy = false;
let authMode = "login";
let showPass = false;
let syncState = "idle";
let deferredPrompt = null;

// S.p item: { id, n, ph: "", due: "", t: "c"|"s", x: [{ k: "g"|"t", a, m, d, due }] }
let S = { p: [], l: [], n: 1, s: "" };
let V = "list", tab = "c", sel = null, q = "", sortByAmt = false, filterChip = "all", sheet = null, cf = null, toastMsg = "", receiptPreview = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  render();
});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = n => (Math.round(n * 10) / 10).toFixed(1) + " د.م.";
const fd = t => {
  const d = new Date(t);
  return d.toLocaleDateString("ar-MA-u-nu-latn", { day: "numeric", month: "long", year: "numeric" }) +
    " · " + d.toLocaleTimeString("ar-MA-u-nu-latn", { hour: "2-digit", minute: "2-digit", hour12: false });
};
const fShortDate = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const bal = p => p.x.reduce((s, x) => s + (x.k === "g" ? x.a : -x.a), 0);
const ago = p => {
  if (!p.x.length) return "جديد";
  const d = Math.max(0, Math.round((Date.now() - Math.max(...p.x.map(x => x.d))) / D));
  if (d === 0) return "اليوم";
  if (d === 1) return "منذ يوم واحد";
  if (d === 2) return "منذ يومين";
  if (d <= 10) return "منذ " + d + " أيام";
  return "منذ " + d + " يوماً";
};

function getDueStatus(p) {
  const b = bal(p);
  if (b === 0) return null;
  const todayStr = new Date().toISOString().slice(0, 10);
  if (p.due) {
    if (p.due < todayStr) return { type: "overdue", label: "متأخر (" + fShortDate(p.due) + ")" };
    if (p.due === todayStr) return { type: "upcoming", label: "يستحق اليوم" };
    return { type: "upcoming", label: "موعد: " + fShortDate(p.due) };
  }
  if (p.x.length) {
    const days = Math.floor((Date.now() - Math.max(...p.x.map(x => x.d))) / D);
    if (days >= 30) return { type: "overdue", label: `متأخر +${days} يوم` };
  }
  return null;
}

function cleanPhone(ph) {
  let digits = String(ph || "").replace(/\D/g, "");
  if (digits.startsWith("00")) digits = digits.slice(2);
  if (digits.startsWith("0") && digits.length === 10) digits = "212" + digits.slice(1);
  return digits;
}

const isDark = () => document.documentElement.dataset.theme === "dark";
const setTheme = t => {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(LOCAL_BASE_KEY + "-theme", t); } catch (e) {}
};
try {
  const t = localStorage.getItem(LOCAL_BASE_KEY + "-theme");
  document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
} catch (e) {
  document.documentElement.dataset.theme = "light";
}

const storageKeyForUser = () => currentUser ? `${LOCAL_BASE_KEY}-${currentUser.uid}` : LOCAL_BASE_KEY;

function loadLocalData() {
  try {
    const raw = localStorage.getItem(storageKeyForUser());
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.p)) {
        S = { p: parsed.p || [], l: parsed.l || [], n: parsed.n || 1, s: parsed.s || "" };
        return;
      }
    }
  } catch (e) {}
  S = { p: [], l: [], n: 1, s: "" };
}

let cloudSaveTimer = null;
async function save() {
  try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}

  if (db && currentUser && !currentUser.isGuest) {
    syncState = "syncing";
    render();
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(async () => {
      try {
        await fbMod.setDoc(fbMod.doc(db, "users", currentUser.uid), {
          p: S.p,
          l: S.l,
          n: S.n,
          s: S.s,
          email: currentUser.email || "",
          displayName: currentUser.displayName || "",
          updatedAt: Date.now()
        }, { merge: true });
        syncState = "synced";
      } catch (err) {
        console.error("Firestore sync error:", err);
        syncState = "offline";
      }
      render();
    }, 350);
  }
}

async function bindUserCloudData(user) {
  if (unsubDoc) { unsubDoc(); unsubDoc = null; }
  currentUser = user;
  loadLocalData();

  if (!db || !user || user.isGuest) {
    syncState = "offline";
    authReady = true;
    render();
    return;
  }

  syncState = "syncing";
  authReady = true;
  render();

  const userRef = fbMod.doc(db, "users", user.uid);
  try {
    const snap = await fbMod.getDoc(userRef);
    if (snap.exists()) {
      const d = snap.data();
      S = { p: d.p || [], l: d.l || [], n: d.n || 1, s: d.s || "" };
      try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}
    } else {
      await fbMod.setDoc(userRef, {
        p: S.p,
        l: S.l,
        n: S.n,
        s: S.s,
        email: user.email || "",
        displayName: user.displayName || "",
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
    }
    syncState = "synced";

    unsubDoc = fbMod.onSnapshot(userRef, s => {
      if (s.metadata.hasPendingWrites || !s.exists()) return;
      const d = s.data();
      S = { p: d.p || [], l: d.l || [], n: d.n || 1, s: d.s || "" };
      try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}
      render();
    });
  } catch (err) {
    console.error("Error loading user cloud data:", err);
    syncState = "offline";
    showToast("تأكد من تفعيل Firestore ونشر قواعد الأمان");
  }
  render();
}

let fbMod = {};

async function initFirebase() {
  render();

  const fallbackTimer = setTimeout(() => {
    if (!authReady) {
      if (localStorage.getItem(GUEST_MODE_KEY) === "1") {
        bindUserCloudData({ uid: "local-user", displayName: "حساب محلي", email: "محفوظ على هذا الجهاز", isGuest: true });
      } else {
        currentUser = null;
        authReady = true;
        render();
      }
    }
  }, 3000);

  try {
    const [appSdk, authSdk, fsSdk] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
    ]);
    fbMod = { ...appSdk, ...authSdk, ...fsSdk };

    for (const app of fbMod.getApps()) await fbMod.deleteApp(app);
    fbApp = fbMod.initializeApp(FIREBASE_CONFIG);
    auth = fbMod.getAuth(fbApp);
    db = fbMod.getFirestore(fbApp);

    fbMod.onAuthStateChanged(auth, async user => {
      clearTimeout(fallbackTimer);
      if (user) {
        localStorage.removeItem(GUEST_MODE_KEY);
        await bindUserCloudData(user);
      } else if (localStorage.getItem(GUEST_MODE_KEY) === "1") {
        await bindUserCloudData({ uid: "local-user", displayName: "حساب محلي", email: "محفوظ على هذا الجهاز", isGuest: true });
      } else {
        if (unsubDoc) { unsubDoc(); unsubDoc = null; }
        currentUser = null;
        authReady = true;
        render();
      }
    });
  } catch (err) {
    console.error("Firebase init failed:", err);
    clearTimeout(fallbackTimer);
    if (localStorage.getItem(GUEST_MODE_KEY) === "1") {
      await bindUserCloudData({ uid: "local-user", displayName: "حساب محلي", email: "محفوظ على هذا الجهاز", isGuest: true });
    } else {
      currentUser = null;
      authReady = true;
      render();
    }
  }
}

function mapAuthError(code) {
  switch (code) {
    case "auth/invalid-email": return "صيغة البريد الإلكتروني غير صحيحة";
    case "auth/user-not-found":
    case "auth/wrong-password":
    case "auth/invalid-credential": return "البريد الإلكتروني أو كلمة المرور غير صحيحة";
    case "auth/email-already-in-use": return "هذا البريد الإلكتروني مسجل بالفعل، سجّل الدخول";
    case "auth/weak-password": return "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
    case "auth/operation-not-allowed": return "فعّل خيار البريد الإلكتروني في Authentication داخل Firebase";
    case "auth/unauthorized-domain": return "أضف رابط موقعك في Authorized domains داخل Firebase";
    case "auth/too-many-requests": return "محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً";
    default: return "حدث خطأ: " + (code || "حاول مجدداً");
  }
}

async function handleEmailSubmit() {
  if (!auth) { showToast("يرجى الاتصال بالإنترنت لتسجيل الدخول أو اختر الدخول بدون حساب"); return; }
  const email = ($("#auth-email")?.value || "").trim();
  const password = $("#auth-password")?.value || "";
  const fullName = ($("#auth-name")?.value || "").trim();
  const remember = $("#auth-remember")?.checked ?? true;

  if (!email) { showToast("يرجى إدخال البريد الإلكتروني"); return; }

  if (authMode === "reset") {
    authBusy = true;
    render();
    try {
      await fbMod.sendPasswordResetEmail(auth, email);
      showToast("تم إرسال رابط استعادة كلمة المرور إلى بريدك");
      authMode = "login";
    } catch (err) {
      showToast(mapAuthError(err.code));
    } finally {
      authBusy = false;
      render();
    }
    return;
  }

  if (!password) { showToast("يرجى إدخال كلمة المرور"); return; }

  authBusy = true;
  render();
  try {
    await fbMod.setPersistence(auth, remember ? fbMod.browserLocalPersistence : fbMod.browserSessionPersistence);
    if (authMode === "register") {
      const cred = await fbMod.createUserWithEmailAndPassword(auth, email, password);
      if (fullName) {
        await fbMod.updateProfile(cred.user, { displayName: fullName });
      }
      showToast("تم إنشاء حسابك بنجاح");
    } else {
      await fbMod.signInWithEmailAndPassword(auth, email, password);
      showToast("مرحباً بعودتك");
    }
  } catch (err) {
    console.error(err);
    showToast(mapAuthError(err.code));
  } finally {
    authBusy = false;
    render();
  }
}

async function handleGoogleLogin() {
  if (!auth) { showToast("يرجى الاتصال بالإنترنت لتسجيل الدخول أو اختر الدخول بدون حساب"); return; }
  authBusy = true;
  render();
  try {
    const provider = new fbMod.GoogleAuthProvider();

    await fbMod.signInWithPopup(auth, provider);
    showToast("تم تسجيل الدخول بنجاح");
  } catch (err) {
    console.error(err);
    showToast(mapAuthError(err.code));
  } finally {
    authBusy = false;
    render();
  }
}

    ? `المبلغ المستحق لكم: *${f(b)}*`
    : b < 0
      ? `المبلغ المستحق عليكم: *${f(-b)}*`
      : `الحساب خالص: *0.0 د.م.*`;

  const recent = [...p.x].sort((a, b) => b.d - a.d).slice(0, 5);
  const txLines = recent.length
    ? "

📋 *آخر المعاملات:*
" + recent.map(x => {
        const dt = new Date(x.d).toLocaleDateString("ar-MA-u-nu-latn", { day: "numeric", month: "short" });
        const kind = x.k === "g" ? "أعطيت" : "دفعة/أخذت";
        return `• ${dt}: ${kind} (${f(x.a)})${x.m ? " - " + x.m : ""}`;
      }).join("
")
    : "";

  const dueLine = p.due && b !== 0 ? `
📅 موعد السداد: ${fShortDate(p.due)}` : "";

💰 ${statusLine}${dueLine}${txLines}

شكراً لتعاملكم معنا.`;

    ? `https://wa.me/${phoneDigits}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

/* ==========================================================================
   2. توليد بطاقة كشف حساب مصوّرة (Canvas PNG) ومشاركتها أو تنزيلها
   ========================================================================== */
function generateStatementImage(p) {
  const canvas = document.createElement("canvas");
  const W = 720, H = 960;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // خلفية Liquid Glass
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#003b91");
  bg.addColorStop(0.5, "#075bdc");
  bg.addColorStop(1, "#2e1065");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // توهج دائري
  const g1 = ctx.createRadialGradient(120, 120, 10, 120, 120, 280);
  g1.addColorStop(0, "rgba(0, 234, 255, 0.45)");
  g1.addColorStop(1, "transparent");
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  const g2 = ctx.createRadialGradient(600, 820, 10, 600, 820, 300);
  g2.addColorStop(0, "rgba(163, 76, 255, 0.48)");
  g2.addColorStop(1, "transparent");
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  // البطاقة الزجاجية الوسطى
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(44, 48, W - 88, H - 96, 42);
  ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
  ctx.stroke();
  ctx.restore();

  ctx.direction = "rtl";
  ctx.textAlign = "center";

  // اسم المتجر
  ctx.fillStyle = "#8cefff";
  ctx.font = "bold 26px Cairo, sans-serif";
  ctx.fillText(S.s || "دفتر الكريدي", W / 2, 118);

  // عنوان الكشف
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 38px Cairo, sans-serif";
  ctx.fillText("كشف حساب مفصل", W / 2, 174);

  // اسم العميل والتاريخ
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.font = "bold 28px Cairo, sans-serif";
  ctx.fillText(p.n + (p.ph ? `  (${p.ph})` : ""), W / 2, 232);

  const todayTxt = new Date().toLocaleDateString("ar-MA-u-nu-latn", { day: "numeric", month: "long", year: "numeric" });
  ctx.fillStyle = "rgba(224,242,254,0.75)";
  ctx.font = "20px Cairo, sans-serif";
  ctx.fillText("تاريخ الإصدار: " + todayTxt, W / 2, 272);

  // صندوق صافي الرصيد
  const b = bal(p);
  ctx.beginPath();
  ctx.roundRect(84, 305, W - 168, 136, 28);
  ctx.fillStyle = "rgba(0, 20, 60, 0.35)";
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = b > 0 ? "#4ade80" : b < 0 ? "#ff5c77" : "#8cefff";
  ctx.stroke();

  ctx.fillStyle = "#e0f2fe";
  ctx.font = "bold 22px Cairo, sans-serif";
  ctx.fillText(b > 0 ? "صافي المبلغ المستحق (لي)" : b < 0 ? "صافي المبلغ المستحق (عليّ)" : "الرصيد الصافي (خالص)", W / 2, 354);

  ctx.fillStyle = b > 0 ? "#4ade80" : b < 0 ? "#fda4af" : "#ffffff";
  ctx.font = "900 46px Cairo, sans-serif";
  ctx.fillText(f(Math.abs(b)), W / 2, 414);

  // آخر المعاملات
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 24px Cairo, sans-serif";
  ctx.fillText("آخر المعاملات المسجلة:", W - 88, 496);

  const recent = [...p.x].sort((a, b) => b.d - a.d).slice(0, 6);
  let yPos = 544;
  if (!recent.length) {
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "22px Cairo, sans-serif";
    ctx.fillText("لا توجد معاملات مسجلة حالياً", W / 2, 600);
  } else {
    recent.forEach(x => {
      ctx.beginPath();
      ctx.roundRect(84, yPos - 34, W - 168, 52, 16);
      ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
      ctx.fill();

      const dt = new Date(x.d).toLocaleDateString("ar-MA-u-nu-latn", { day: "numeric", month: "short", year: "numeric" });
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px Cairo, sans-serif";
      ctx.fillText(`${dt}${x.m ? " · " + x.m.slice(0, 22) : ""}`, W - 104, yPos);

      ctx.textAlign = "left";
      ctx.fillStyle = x.k === "g" ? "#6ee7b7" : "#fda4af";
      ctx.font = "900 21px Cairo, sans-serif";
      ctx.fillText((x.k === "g" ? "+ " : "- ") + f(x.a), 104, yPos);

      yPos += 62;
    });
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "18px Cairo, sans-serif";
  ctx.fillText("تم الإنشاء عبر تطبيق دفتر الكريدي", W / 2, H - 72);

  receiptPreview = {
    url: canvas.toDataURL("image/png"),
    name: p.n
  };
  render();
}

async function shareOrDownloadReceipt() {
  if (!receiptPreview) return;
  try {
    const res = await fetch(receiptPreview.url);
    const blob = await res.blob();
    const file = new File([blob], `كشف-حساب-${receiptPreview.name}.png`, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: `كشف حساب ${receiptPreview.name}`,
        text: `كشف حساب ${receiptPreview.name} من ${S.s || "دفتر الكريدي"}`,
        files: [file]
      });
      return;
    }
  } catch (e) {}
  const a = document.createElement("a");
  a.href = receiptPreview.url;
  a.download = `كشف-حساب-${receiptPreview.name}.png`;
  a.click();
  showToast("تم حفظ صورة كشف الحساب على هاتفك");
}

/* ==========================================================================
   3. تصدير البيانات إلى Excel (CSV) وطباعة PDF
   ========================================================================== */
function exportExcelCSV() {
  const rows = [
    ["النوع", "الاسم", "الهاتف", "الرصيد (د.م.)", "الحالة", "موعد السداد", "عدد المعاملات"]
  ];
  S.p.forEach(p => {
    const b = bal(p);
    rows.push([
      p.t === "c" ? "عميل" : "مورد",
      p.n,
      p.ph || "-",
      (Math.round(Math.abs(b) * 10) / 10).toFixed(1),
      b > 0 ? "لي" : b < 0 ? "عليّ" : "خالص",
      p.due || "-",
      String(p.x.length)
    ]);
  });

  if (S.l.length) {
    rows.push([]);
    rows.push(["سجل صندوق المتجر", "النوع", "المبلغ (د.م.)", "التاريخ", "ملاحظة"]);
    S.l.forEach(x => {
      rows.push([
        "حساب المتجر",
        x.k === "i" ? "مدخول" : "مصروف",
        (Math.round(x.a * 10) / 10).toFixed(1),
        new Date(x.d).toLocaleDateString("ar-MA-u-nu-latn"),
        x.m || "-"
      ]);
    });
  }

  const csvContent = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("
");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `تقرير-${(S.s || "دفتر-الكريدي").replace(/\s+/g, "-")}.csv`;
  link.click();
  URL.revokeObjectURL(url);
  showToast("تم تنزيل ملف Excel (CSV) بنجاح");
}

function userAvatarBadge() {
  if (!currentUser) return "";
  const dot = !currentUser.isGuest ? `<span class="sync-dot ${syncState === "syncing" ? "syncing" : ""}"></span>` : "";
  if (currentUser.photoURL) {
    return `<button class="glass-circle" data-v="set" title="${esc(currentUser.displayName || "الحساب")}"><img src="${esc(currentUser.photoURL)}" alt="">${dot}</button>`;
  }
  const initial = (currentUser.displayName || currentUser.email || "م")[0];
  return `<button class="glass-circle" data-v="set" title="الحساب"><span style="font-weight:900;font-size:14px">${esc(initial)}</span>${dot}</button>`;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-back],[data-v],[data-sheet],[data-ok],[data-close],[data-delx],[data-dell],[data-delp],[data-reset],[data-theme-set],[data-cfok],[data-cfno],[data-sort],[data-chip],[data-glogin],[data-guest],[data-logout],[data-authmode],[data-email-submit],[data-toggle-pass],[data-wa],[data-receipt],[data-close-receipt],[data-share-receipt],[data-export-csv],[data-print-pdf],[data-install-pwa]");
  if (!t) return;
  const d = t.dataset;
  if (t.hasAttribute("data-close") && e.target !== t) return;

  if ("togglePass" in d) {
    const prevEmail = $("#auth-email")?.value || "";
    const prevName = $("#auth-name")?.value || "";
    const prevPass = $("#auth-password")?.value || "";
    showPass = !showPass;
    render();
    if ($("#auth-email")) $("#auth-email").value = prevEmail;
    if ($("#auth-name")) $("#auth-name").value = prevName;
    if ($("#auth-password")) $("#auth-password").value = prevPass;
    return;
  }

  if ("authmode" in d) {
    const prevEmail = $("#auth-email")?.value || "";
    authMode = d.authmode;
    showPass = false;
    render();
    if ($("#auth-email")) $("#auth-email").value = prevEmail;
    return;
  }

  if ("emailSubmit" in d) { await handleEmailSubmit(); return; }
  if ("glogin" in d) { await handleGoogleLogin(); return; }
  if ("guest" in d) {
    localStorage.setItem(GUEST_MODE_KEY, "1");
    await bindUserCloudData({ uid: "local-user", displayName: "حساب محلي", email: "محفوظ على هذا الجهاز", isGuest: true });
    return;
  }
  if ("logout" in d) { await handleLogout(); return; }

  if ("wa" in d) {
    const p = S.p.find(x => x.id === sel);
    if (p) shareWhatsAppText(p);
    return;
  }
  if ("receipt" in d) {
    const p = S.p.find(x => x.id === sel);
    if (p) generateStatementImage(p);
    return;
  }
  if ("closeReceipt" in d) { receiptPreview = null; render(); return; }
  if ("shareReceipt" in d) { await shareOrDownloadReceipt(); return; }
  if ("exportCsv" in d) { exportExcelCSV(); return; }
  if ("printPdf" in d) { window.print(); return; }
  if ("installPwa" in d && deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    render();
    return;
  }

  if ("tab" in d) { tab = d.tab; q = ""; filterChip = "all"; }
  else if ("chip" in d) { filterChip = d.chip; }
  else if ("open" in d) { sel = +d.open; V = "detail"; }
  else if ("back" in d) V = "list";
  else if ("v" in d) V = d.v;
  else if ("sort" in d) { sortByAmt = !sortByAmt; showToast(sortByAmt ? "تم الترتيب حسب أعلى مبلغ" : "تم إلغاء الفرز"); return; }
  else if ("sheet" in d) sheet = d.sheet;
  else if ("close" in d) { sheet = null; cf = null; receiptPreview = null; }
  else if ("ok" in d) {
    if (sheet === "newc") {
      const n = $("#nm").value.trim();
      if (!n) return;
      const ph = ($("#ph")?.value || "").trim();
      const due = ($("#due")?.value || "").trim();
      S.p.push({ id: S.n++, n, ph, due, t: tab, x: [] });
    } else if (sheet === "editp") {
      const p = S.p.find(x => x.id === sel);
      if (p) {
        const n = $("#nm").value.trim();
        if (!n) return;
        p.n = n;
        p.ph = ($("#ph")?.value || "").trim();
        p.due = ($("#due")?.value || "").trim();
      }
    } else if (sheet === "edittitle") {
      const val = $("#ttl").value.trim();
      S.s = val || "دفتر الكريدي";
    } else {
      const a = parseFloat($("#am").value);
      if (!(a > 0)) return;
      const m = $("#nt").value.trim();
      const now = Date.now();
      const x = { k: sheet, a, m, d: now };
      if (sheet === "i" || sheet === "o") {
        S.l.push(x);
      } else {
        const p = S.p.find(x => x.id === sel);
        p.x.push(x);
        if (sheet === "g") {
          const newDue = ($("#txdue")?.value || "").trim();
          if (newDue) p.due = newDue;
        }
        if (bal(p) === 0) p.due = "";

        // الترحيل التلقائي لصندوق المتجر
        const syncStore = $("#sync-store")?.checked;
        if (syncStore) {
          S.l.push({
            k: sheet === "t" ? "i" : "o",
            a,
            m: `${sheet === "t" ? "تحصيل من" : "دفع لـ"} ${p.n}${m ? " (" + m + ")" : ""}`,
            d: now + 1
          });
        }
      }
    }
    sheet = null;
    await save();
  }
  else if ("delx" in d) {
    const p = S.p.find(x => x.id === sel);
    p.x = p.x.filter(x => x.d !== +d.delx);
    await save();
  }
  else if ("dell" in d) {
    S.l = S.l.filter(x => x.d !== +d.dell);
    await save();
  }
  else if ("delp" in d) {
    const p = S.p.find(x => x.id === +d.delp);
    if (!p) return;
    cf = { m: "سيتم حذف «" + p.n + "» وجميع معاملاته نهائياً. هل أنت متأكد؟", a: "delp", id: p.id };
  }
  else if ("cfno" in d) cf = null;
  else if ("cfok" in d) {
    if (cf.a === "reset") { S = { p: [], l: [], n: 1, s: "" }; tab = "c"; q = ""; sel = null; V = "list"; }
    else if (cf.a === "delp") { S.p = S.p.filter(p => p.id !== cf.id); V = "list"; sel = null; }
    cf = null;
    await save();
  }
  else if ("themeSet" in d) setTheme(d.themeSet);
  else if ("reset" in d) cf = { m: "سيتم مسح جميع بيانات هذا الحساب والعودة إلى الصفر. هل أنت متأكد؟", a: "reset" };

  render();
});

document.addEventListener("keydown", async e => {
  if (e.key === "Enter" && !currentUser && (e.target.id === "auth-email" || e.target.id === "auth-password" || e.target.id === "auth-name")) {
    e.preventDefault();
    await handleEmailSubmit();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "sn") { S.s = e.target.value.trim(); save(); }
  if (e.target.id === "q") { q = e.target.value; render(); }
});

initFirebase();
</script>
